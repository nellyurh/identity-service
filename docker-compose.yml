services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: identity_service
      DB_USERNAME: unero
      DB_PASSWORD: unero
      DB_SCHEMA: identity
      CACHE_STORE: redis
      REDIS_HOST: redis
      EVENT_BUS_NAME: unero-dev
      AWS_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: identity_service
      POSTGRES_USER: unero
      POSTGRES_PASSWORD: unero
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "unero"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: events,sqs
    ports:
      - "4566:4566"
